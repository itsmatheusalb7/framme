<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Framme</title><link rel="stylesheet" href="/login.css"></head>
<body><main class="access-layout"><section class="story story-video" aria-label="Vídeo de apresentação Framme"><video class="login-video" autoplay muted loop playsinline preload="auto" aria-label="Apresentação Framme"><source src="/video-login.mp4" type="video/mp4"></video></section><section class="access"><div class="access-card"><a class="brand access-brand" href="/login" aria-label="Framme">framme<span>✳</span></a><h2 id="access-title">Comece sua próxima criação.</h2><p id="access-description">Entre para continuar criando e acessar seus vídeos.</p><form id="access-form"><div id="name-row" hidden><label for="name">Seu nome</label><input id="name" autocomplete="name" maxlength="80" placeholder="Como podemos chamar você?"></div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="voce@exemplo.com"><label for="password">Senha</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Digite sua senha"><button type="button" id="show-password" aria-label="Mostrar senha">Mostrar</button></div><p id="access-message" role="status" aria-live="polite"></p><button id="enter" class="primary" type="submit" disabled>Entrar na Framme <span aria-hidden="true">→</span></button></form><p class="access-switch" id="access-switch">Não tem uma conta? <a href="/register">Registrar-se</a></p><p class="access-note" id="access-note">© 2026 Framme</p></div></section></main><script src="/login.js"></script></body></html>
